[project]
name = "tariff-assistant-api"
version = "0.1.0"
description = "Tariff classification and pedimento assistant - MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    # PyMongo's async API (AsyncMongoClient) replaces the deprecated Motor driver.
    "pymongo>=4.9.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "anthropic>=0.40.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.20.0",
    "jinja2>=3.1.4",
    "weasyprint>=63.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
