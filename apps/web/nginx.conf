# Serves the built SPA and proxies the API on the same origin.
#
# Keeping both behind one hostname means the browser never issues a CORS
# preflight and the frontend needs no build-time API URL: `client.ts` falls back
# to the relative "/api", exactly as it does behind the Vite dev proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # RF-03 accepts photographs up to 10 MB. nginx defaults to 1 MB and would
    # reject the upload with a 413 before it ever reached FastAPI.
    client_max_body_size 12m;

    # The trailing slash on proxy_pass strips the /api prefix, mirroring the
    # rewrite in vite.config.ts so both environments hit the same routes.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extraction and classification each call Claude; the PRD budgets 20 s
        # per call and a cold container can approach it.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router owns the paths; anything not on disk resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable, index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
